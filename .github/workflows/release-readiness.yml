name: Authenticated release readiness
on:
  workflow_dispatch:
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Require authenticated staging configuration
        env:
          BASE_URL: ${{ secrets.STAGING_URL }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.E2E_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.E2E_CLERK_SECRET_KEY }}
          E2E_CLERK_USER_EMAIL: ${{ secrets.E2E_CLERK_USER_EMAIL }}
          E2E_CLERK_USER_PASSWORD: ${{ secrets.E2E_CLERK_USER_PASSWORD }}
        run: |
          node -e "for (const key of ['BASE_URL','NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY','CLERK_SECRET_KEY','E2E_CLERK_USER_EMAIL','E2E_CLERK_USER_PASSWORD']) { if (!process.env[key]) throw new Error('Missing '+key); }"
      - name: Verify authenticated core journey without skips
        run: npx playwright test e2e/release-core.spec.ts
        env:
          BASE_URL: ${{ secrets.STAGING_URL }}
          E2E_REQUIRE_AUTH: 'true'
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.E2E_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.E2E_CLERK_SECRET_KEY }}
          E2E_CLERK_USER_EMAIL: ${{ secrets.E2E_CLERK_USER_EMAIL }}
          E2E_CLERK_USER_PASSWORD: ${{ secrets.E2E_CLERK_USER_PASSWORD }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: release-readiness
          path: |
            playwright-report/
            test-results/
